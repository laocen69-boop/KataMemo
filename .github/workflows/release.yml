name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.3+12)"
        required: true
        default: "v1.0.3+12"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK (arm64)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare release asset
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          SAFE_VER="${TAG#v}"
          SAFE_VER="${SAFE_VER//+/-}"
          APK_NAME="KataMemo-${SAFE_VER}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          SHA=$(sha256sum "${APK_NAME}" | awk '{print $1}')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: KataMemo ${{ steps.meta.outputs.tag }}
          body: |
            KataMemo Open Source release (`arm64-v8a`).
            SHA-256: `${{ steps.meta.outputs.sha }}`
          files: |
            ${{ steps.meta.outputs.apk }}
