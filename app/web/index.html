<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="KataMemo — 印尼语背单词与语法学习（FSRS-6 间隔重复）">
  <meta name="theme-color" content="#147B5D">

  <!-- iOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KataMemo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KataMemo — 印尼语背单词</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#F4F8F6;">
  <style>
    @font-face {
      font-family: "PlusJakartaSans";
      src: url("assets/assets/fonts/PlusJakartaSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "PlusJakartaSans";
      src: url("assets/assets/fonts/PlusJakartaSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    #km-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #F4F8F6;
      color: #163028;
      font-family: "PlusJakartaSans", "NotoSans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    #km-boot-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #147B5D;
    }
    #km-boot-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #D5E5DE;
      border-top-color: #147B5D;
      border-radius: 50%;
      animation: km-spin 0.85s linear infinite;
      margin-bottom: 14px;
    }
    #km-boot-text {
      font-size: 14px;
      line-height: 1.6;
      color: #466058;
      max-width: 320px;
    }
    #km-boot-inapp, #km-boot-slow {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1px solid #D7E3DD;
      font-size: 13px;
      line-height: 1.55;
      color: #2D453E;
      max-width: 320px;
    }
    #km-boot-reload {
      margin-top: 10px;
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      background: #147B5D;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    @keyframes km-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="km-boot-splash" role="status" aria-live="polite">
    <div id="km-boot-title">KataMemo</div>
    <div id="km-boot-spinner"></div>
    <div id="km-boot-text">正在加载 KataMemo…（首次打开需载入本地词库，约 10~20 秒）</div>
    <div id="km-boot-inapp">检测到当前处于应用内浏览器，部分内置浏览器可能限制本地数据库或离线缓存。如长时间无响应，请点击右上角选择「在浏览器中打开」（Safari / Chrome）。</div>
    <div id="km-boot-slow">
      <div>当前网络较慢或缓存异常，已等待超过 15 秒。建议刷新重试，或切换至 Safari / Chrome 浏览器。</div>
      <button id="km-boot-reload" type="button" onclick="location.reload()">刷新重试</button>
    </div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('km-boot-splash');
      var inappEl = document.getElementById('km-boot-inapp');
      var slowEl = document.getElementById('km-boot-slow');
      var ua = navigator.userAgent || '';
      if (inappEl && /MicroMessenger|FBAN|FBAV|Instagram|Line\/|WhatsApp/i.test(ua)) {
        inappEl.style.display = 'block';
      }
      var slowTimer = setTimeout(function () {
        if (splash && splash.parentNode && slowEl) {
          slowEl.style.display = 'block';
        }
      }, 15000);
      function removeSplash() {
        if (slowTimer) {
          clearTimeout(slowTimer);
          slowTimer = null;
        }
        if (observer) {
          observer.disconnect();
          observer = null;
        }
        if (splash && splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });
      var observer = null;
      if (typeof MutationObserver !== 'undefined') {
        observer = new MutationObserver(function () {
          if (document.querySelector('flutter-view, flt-glass-pane')) {
            removeSplash();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();

    // Auto-reload into updated Service Worker during initial boot window
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!reloading && performance.now() < 12000) {
          reloading = true;
          location.reload();
        }
      });
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update().catch(function () {});
      }).catch(function () {});
    })();

    // Unlock Web Audio on first user gesture for iOS Safari autoSpeak
    (function () {
      var unlocked = false;
      function unlock() {
        if (unlocked) return;
        unlocked = true;
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            var ctx = new Ctx();
            var buf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            if (src.start) src.start(0);
            if (ctx.state === 'suspended') ctx.resume();
          }
        } catch (e) {}
        window.removeEventListener('touchstart', unlock, true);
        window.removeEventListener('pointerdown', unlock, true);
      }
      window.addEventListener('touchstart', unlock, true);
      window.addEventListener('pointerdown', unlock, true);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
